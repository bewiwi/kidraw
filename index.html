<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KiDraw — Drawing for Kids</title>
    <meta name="description" content="A fun, pressure-sensitive drawing app for kids with infinite canvas">
    <meta property="og:title" content="KiDraw — Drawing for Kids">
    <meta property="og:description" content="A fun, pressure-sensitive drawing app for kids with infinite canvas, multiple tools, and symmetry mode">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div id="app">
        <header id="top-bar">
            <div id="topbar-left">
                <button id="btn-gallery" class="topbar-btn" title="Gallery">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
                </button>
                <input id="drawing-title" type="text" value="Untitled Drawing" maxlength="40" spellcheck="false">
            </div>
            <div id="topbar-right">
                <button id="btn-undo" class="topbar-btn" title="Undo (Ctrl+Z)" disabled>
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>
                </button>
                <button id="btn-redo" class="topbar-btn" title="Redo (Ctrl+Shift+Z)" disabled>
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.13-9.36L23 10"/></svg>
                </button>
                <div class="topbar-separator"></div>
                <button id="btn-save" class="topbar-btn" title="Save & Download Image (Ctrl+S)">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
                </button>
                <button id="btn-clear" class="topbar-btn topbar-btn--danger" title="Clear Canvas">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
                </button>
            </div>
        </header>

        <aside id="sidebar">
            <div id="tool-buttons"></div>
            <div class="sidebar-separator"></div>
            <div id="size-control">
                <div id="size-preview-wrapper">
                    <div id="size-preview"></div>
                </div>
                <input type="range" id="size-slider" min="1" max="100" value="12" orient="vertical">
                <div id="size-value">12</div>
            </div>
            <div class="sidebar-separator"></div>
            <div id="quick-palette"></div>
            <button id="btn-more-colors" class="sidebar-btn" title="More Colors">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="8" r="2" fill="#e94560"/><circle cx="8" cy="14" r="2" fill="#3498db"/><circle cx="16" cy="14" r="2" fill="#2ecc71"/></svg>
            </button>
        </aside>

        <main id="canvas-container">
            <canvas id="draw-canvas"></canvas>
            <div id="cursor-preview"></div>
        </main>

        <footer id="bottom-bar">
            <div id="zoom-controls">
                <button id="btn-zoom-out" class="bottombar-btn" title="Zoom Out">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="5" y1="12" x2="19" y2="12"/></svg>
                </button>
                <span id="zoom-level">100%</span>
                <button id="btn-zoom-in" class="bottombar-btn" title="Zoom In">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                </button>
                <button id="btn-zoom-fit" class="bottombar-btn" title="Zoom to Fit">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/></svg>
                </button>
            </div>
            <div id="background-controls">
                <button id="btn-background" class="bottombar-btn" title="Background">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="3" y1="9" x2="21" y2="9" opacity="0.3"/><line x1="3" y1="15" x2="21" y2="15" opacity="0.3"/><line x1="9" y1="3" x2="9" y2="21" opacity="0.3"/><line x1="15" y1="3" x2="15" y2="21" opacity="0.3"/></svg>
                </button>
            </div>
            <div id="symmetry-controls">
                <button id="btn-symmetry-h" class="bottombar-btn" title="Horizontal Symmetry">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="2" x2="12" y2="22" stroke-dasharray="2 2"/><rect x="3" y="7" width="6" height="10" rx="1"/><rect x="15" y="7" width="6" height="10" rx="1"/></svg>
                </button>
                <button id="btn-symmetry-v" class="bottombar-btn" title="Vertical Symmetry">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="2" y1="12" x2="22" y2="12" stroke-dasharray="2 2"/><rect x="7" y="3" width="10" height="6" rx="1"/><rect x="7" y="15" width="10" height="6" rx="1"/></svg>
                </button>
            </div>
            <div id="stabilizer-control">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M2 12c2-4 6-4 10 0s8 4 10 0"/></svg>
                <input type="range" id="stabilizer-slider" min="0" max="20" value="5" title="Smoothing">
            </div>
            <div id="bottombar-right">
                <button id="btn-fullscreen" class="bottombar-btn" title="Fullscreen (F11)">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/><line x1="21" y1="3" x2="14" y2="10"/><line x1="3" y1="21" x2="10" y2="14"/></svg>
                </button>
                <button id="btn-shortcuts" class="bottombar-btn" title="Keyboard Shortcuts">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="4" width="20" height="16" rx="2"/><line x1="6" y1="8" x2="6" y2="8"/><line x1="10" y1="8" x2="10" y2="8"/><line x1="14" y1="8" x2="14" y2="8"/><line x1="18" y1="8" x2="18" y2="8"/><line x1="8" y1="16" x2="16" y2="16"/><line x1="6" y1="12" x2="6" y2="12"/><line x1="10" y1="12" x2="10" y2="12"/><line x1="14" y1="12" x2="14" y2="12"/><line x1="18" y1="12" x2="18" y2="12"/></svg>
                </button>
            </div>
        </footer>
    </div>

    <!-- Modals -->
    <div id="modal-overlay" class="modal-overlay hidden">
        <div id="modal-content" class="modal-content"></div>
    </div>

    <!-- Color Picker Panel -->
    <div id="color-picker-panel" class="floating-panel hidden">
        <div class="panel-header">
            <span>Color Picker</span>
            <button id="btn-close-colorpicker" class="panel-close">&times;</button>
        </div>
        <div class="panel-body">
            <canvas id="color-wheel" width="200" height="200"></canvas>
            <div id="color-sliders">
                <div class="color-slider-row">
                    <label>H</label>
                    <input type="range" id="hue-slider" min="0" max="360" value="0">
                    <input type="number" id="hue-input" min="0" max="360" value="0">
                </div>
                <div class="color-slider-row">
                    <label>S</label>
                    <input type="range" id="sat-slider" min="0" max="100" value="100">
                    <input type="number" id="sat-input" min="0" max="100" value="100">
                </div>
                <div class="color-slider-row">
                    <label>L</label>
                    <input type="range" id="light-slider" min="0" max="100" value="50">
                    <input type="number" id="light-input" min="0" max="100" value="50">
                </div>
                <div class="color-slider-row">
                    <label>A</label>
                    <input type="range" id="alpha-slider" min="0" max="100" value="100">
                    <input type="number" id="alpha-input" min="0" max="100" value="100">
                </div>
            </div>
            <div id="hex-row">
                <label>#</label>
                <input type="text" id="hex-input" maxlength="8" value="000000" spellcheck="false">
            </div>
            <div id="color-preview-row">
                <div id="color-preview-old" title="Previous color"></div>
                <div id="color-preview-new" title="New color"></div>
            </div>
        </div>
    </div>

    <!-- Gallery Panel -->
    <div id="gallery-overlay" class="modal-overlay hidden">
        <div id="gallery-panel" class="gallery-panel">
            <div class="panel-header">
                <span>My Drawings</span>
                <button id="btn-close-gallery" class="panel-close">&times;</button>
            </div>
            <div id="gallery-grid"></div>
        </div>
    </div>

    <!-- Shortcuts Panel -->
    <div id="shortcuts-panel" class="floating-panel hidden">
        <div class="panel-header">
            <span>Keyboard Shortcuts</span>
            <button id="btn-close-shortcuts" class="panel-close">&times;</button>
        </div>
        <div class="panel-body shortcuts-body">
            <div class="shortcut-row"><kbd>B</kbd><span>Brush</span></div>
            <div class="shortcut-row"><kbd>P</kbd><span>Pencil</span></div>
            <div class="shortcut-row"><kbd>M</kbd><span>Marker</span></div>
            <div class="shortcut-row"><kbd>E</kbd><span>Eraser</span></div>
            <div class="shortcut-row"><kbd>I</kbd><span>Eyedropper</span></div>
            <div class="shortcut-row"><kbd>[</kbd> <kbd>]</kbd><span>Brush Size</span></div>
            <div class="shortcut-row"><kbd>Ctrl</kbd>+<kbd>Z</kbd><span>Undo</span></div>
            <div class="shortcut-row"><kbd>Ctrl</kbd>+<kbd>Shift</kbd>+<kbd>Z</kbd><span>Redo</span></div>
            <div class="shortcut-row"><kbd>Ctrl</kbd>+<kbd>S</kbd><span>Save</span></div>
            <div class="shortcut-row"><kbd>Space</kbd>+Drag<span>Pan</span></div>
            <div class="shortcut-row"><kbd>Scroll</kbd><span>Zoom</span></div>
            <div class="shortcut-row"><kbd>F11</kbd><span>Fullscreen</span></div>
        </div>
    </div>

    <!-- Toast notification -->
    <div id="toast" class="toast hidden"></div>

    <script type="module" src="src/app.js"></script>
</body>
</html>
